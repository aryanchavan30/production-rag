[project]
name = "production-ready-rag"
version = "0.1.0"
description = "Production-ready local RAG system — no external APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.90.0",
    "chonkie[semantic]>=1.6.0",
    "FlagEmbedding>=1.3.5",
    "qdrant-client>=1.17.1",
    "rank-bm25>=0.2.2",
    "langchain-openai>=0.3.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "transformers>=4.40.0,<5.0.0",
    "hf-xet>=1.4.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "langchain==1.2.15",
    "langgraph==1.1.8",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
]

[project.scripts]
rag = "rag.cli:app"
serve = "rag.api.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
